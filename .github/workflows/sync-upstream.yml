name: Sync Upstream Release
# sync upstream release workflow
on:
  schedule:
    - cron: '23 3 * * *'  # 每天 UTC 03:23
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      need_merge: ${{ steps.check.outputs.need_merge }}
      version: ${{ steps.check.outputs.version }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git 2>/dev/null || true
          git fetch upstream --tags --force

      - name: Check if merge needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取上游最新版本 tag
          LATEST=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No upstream version tag found"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "📦 Upstream latest: $LATEST"

          # 检查是否已有 open 或最近 closed 的 PR（避免重复创建）
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --state all --head "upstream-merge-$LATEST" --json number,state --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "⏭️ PR #$EXISTING_PR already exists for $LATEST, skipping"
            echo "need_merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查上游最新 tag 的提交是否已在当前分支
          UPSTREAM_SHA=$(git rev-list -1 "$LATEST" 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "❌ Cannot resolve upstream tag $LATEST"
            exit 1
          fi

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "need_merge=false" >> $GITHUB_OUTPUT
            echo "✅ $LATEST commit already in history, skip merge"
          else
            echo "need_merge=true" >> $GITHUB_OUTPUT
            echo "📦 $LATEST commit not in history, need merge"
          fi

      - name: Merge upstream release
        if: steps.check.outputs.need_merge == 'true'
        id: merge
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git fetch upstream tag "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 备份本地 workflow 文件
          mkdir -p /tmp/workflow_backup
          cp -r .github/workflows/* /tmp/workflow_backup/ 2>/dev/null || true

          # 删除已存在的分支（清理上次失败的残留）
          BRANCH="upstream-merge-$VERSION"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git branch -D "$BRANCH" 2>/dev/null || true

          # 尝试合并（不自动提交，保留冲突状态）
          git merge "$VERSION" --no-edit --no-commit || true

          # 用 git ls-files -u 检查是否有未解决的冲突
          UNMERGED=$(git ls-files -u)
          if [ -n "$UNMERGED" ]; then
            # 有冲突：创建分支处理
            git checkout -b "$BRANCH"

            CONFLICTS=$(git diff --name-only --diff-filter=U)
            RESOLVED=""
            MANUAL=""
            WORKFLOW_DIFFS=""

            for file in $CONFLICTS; do
              if git status --porcelain "$file" | grep -q "^DU"; then
                git rm "$file"
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (本地已删除，保持删除)"
              elif git status --porcelain "$file" | grep -q "^UD"; then
                git checkout --ours "$file"
                git add "$file"
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (上游已删除，保留本地版本)"
              elif [[ "$file" == .github/workflows/* ]]; then
                git checkout --ours "$file"
                git add "$file"
                FILE_DIFF=$(git diff "$VERSION" HEAD -- "$file" 2>/dev/null | head -100)
                if [ -n "$FILE_DIFF" ]; then
                  WORKFLOW_DIFFS="$WORKFLOW_DIFFS\n\n### $file\n\n\`\`\`diff\n$FILE_DIFF\n\`\`\`"
                fi
              elif git ls-files -s "$file" | awk '{print $1}' | grep -q "^160000"; then
                # 子模块 gitlink 冲突：直接采用上游 gitlink。
                # 已确认本地提交是上游提交的前向祖先，无内部分叉，等价于库升级。
                # 用 update-index --cacheinfo 直接写索引，避免未检出子模块导致 git add 失败。
                SUBMODULE_SHA=$(git ls-tree "$VERSION" -- "$file" | awk '{print $3}')
                git update-index --cacheinfo "160000,${SUBMODULE_SHA},$file" 2>/dev/null || true
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (子模块冲突，采用上游 gitlink)"
              else
                # 内容冲突：暂存工作区合并结果（可能含冲突标记），交由人工在 PR 中复核
                git add "$file"
                MANUAL="$MANUAL\n- ⚠️ \`$file\` (内容冲突，暂存供人工复核)"
              fi
            done

            # 恢复所有本地 workflow 文件
            cp -f /tmp/workflow_backup/* .github/workflows/ 2>/dev/null || true
            git add .github/workflows/
            RESOLVED="$RESOLVED\n- ✅ 所有 workflow 文件 (保留本地版本)"

            # 兜底：逐个暂存所有遗留未合并项，确保提交前索引无 unmerged 项。
            # （替换原先脆弱的复合 git add ... libs/ ...，该命令因子模块冲突中止导致 commit 退出 128）
            for f in $(git diff --name-only --diff-filter=U); do
              if git ls-files -s "$f" | awk '{print $1}' | grep -q "^160000"; then
                SUBMODULE_SHA=$(git ls-tree "$VERSION" -- "$f" | awk '{print $3}')
                git update-index --cacheinfo "160000,${SUBMODULE_SHA},$f" 2>/dev/null || true
              else
                git add "$f" 2>/dev/null || true
              fi
            done
            git commit -m "Merge upstream release $VERSION (conflicts resolved)"
            git push origin "$BRANCH" --force

            # 保存变量供后续 step 使用
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo -e "$RESOLVED" > /tmp/pr_resolved.txt
            echo -e "$MANUAL" > /tmp/pr_manual.txt
            echo -e "$WORKFLOW_DIFFS" > /tmp/pr_workflow_diffs.txt

            echo "merged=false" >> $GITHUB_OUTPUT
            echo "⚠️ Conflicts detected for v$VERSION"
          else
            # 无冲突：恢复本地 workflow 文件，提交合并
            cp -f /tmp/workflow_backup/* .github/workflows/
            git add .github/workflows/
            git commit -m "Merge upstream release $VERSION"
            git push origin HEAD:custom-build
            echo "✅ Merged $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "merged=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR for conflicts
        if: steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.merge.outputs.version }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        with:
          token: ${{ secrets.REPO_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const branch = process.env.BRANCH;
            const resolved = fs.readFileSync('/tmp/pr_resolved.txt', 'utf8');
            const manual = fs.readFileSync('/tmp/pr_manual.txt', 'utf8');
            const workflowDiffs = fs.readFileSync('/tmp/pr_workflow_diffs.txt', 'utf8');

            let body = `自动合并上游版本 ${version} 时出现冲突。\n\n## 已自动解决\n${resolved}\n\n## 需人工处理\n${manual}`;

            if (workflowDiffs.trim()) {
              body += `\n\n---\n\n## 上游 workflow 文件变更（已丢弃，仅供参考）\n\n以下为上游对 workflow 文件的改动，本地版本已保留。如需采用上游改动，请手动合并。${workflowDiffs}`;
            }

            body += `\n\n---\n\n### 合并方式\n\n**请在合并 commit 消息中包含 \`[build]\` 以自动触发编译。**\n\n推荐使用以下 commit 消息：\n\`\`\`\nMerge upstream release ${version} [build]\n\`\`\`\n\n或在 GitHub 合并页面底部的输入框中修改消息。`;

            const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
            try {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Merge upstream release ${version} (${timestamp})`,
                body: body,
                base: 'custom-build',
                head: branch
              });
              console.log(`✅ PR created: ${pr.data.html_url}`);
            } catch (error) {
              if (error.message.includes('already exists')) {
                console.log('PR already exists');
              } else {
                throw error;
              }
            }

      - name: Trigger build
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'custom-build'
            });
            console.log('✅ Triggered build.yml');

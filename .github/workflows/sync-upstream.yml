name: Sync Upstream Release
# sync upstream release workflow
on:
  schedule:
    - cron: '23 3 * * *'  # 每天 UTC 03:23
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      need_merge: ${{ steps.check.outputs.need_merge }}
      version: ${{ steps.check.outputs.version }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git 2>/dev/null || true
          git fetch upstream --tags --force

      - name: Check if merge needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查是否已有 open 的 PR（避免重复创建）
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --state open --head "upstream-merge-*" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "⏭️ PR #$EXISTING_PR already exists, skipping"
            echo "need_merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 获取上游最新版本 tag
          LATEST=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No upstream version tag found"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "📦 Upstream latest: $LATEST"

          # 检查上游最新 tag 的提交是否已在当前分支
          UPSTREAM_SHA=$(git rev-list -1 "$LATEST" 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "❌ Cannot resolve upstream tag $LATEST"
            exit 1
          fi

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "need_merge=false" >> $GITHUB_OUTPUT
            echo "✅ $LATEST commit already in history, skip merge"
          else
            echo "need_merge=true" >> $GITHUB_OUTPUT
            echo "📦 $LATEST commit not in history, need merge"
          fi

      - name: Merge upstream release
        if: steps.check.outputs.need_merge == 'true'
        id: merge
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git fetch upstream tag "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 备份本地 workflow 文件
          mkdir -p /tmp/workflow_backup
          cp -r .github/workflows/* /tmp/workflow_backup/ 2>/dev/null || true

          # 删除已存在的分支（清理上次失败的残留）
          BRANCH="upstream-merge-$VERSION"
          git push origin --delete "$BRANCH" 2>/dev/null || true

          # 尝试合并
          if git merge "$VERSION" --no-edit -m "Merge upstream release $VERSION"; then
            # 无冲突：恢复本地 workflow 文件
            cp -f /tmp/workflow_backup/* .github/workflows/
            git add .github/workflows/
            if ! git diff --cached --quiet; then
              git commit -m "Keep local workflow files"
            fi
            git push origin HEAD
            echo "✅ Merged $VERSION"
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            # 有冲突：创建分支处理
            git checkout -b "$BRANCH"

            CONFLICTS=$(git diff --name-only --diff-filter=U)
            RESOLVED=""
            MANUAL=""
            WORKFLOW_DIFFS=""

            for file in $CONFLICTS; do
              if git status --porcelain "$file" | grep -q "^DU"; then
                git rm "$file"
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (本地已删除，保持删除)"
              elif git status --porcelain "$file" | grep -q "^UD"; then
                git checkout --ours "$file"
                git add "$file"
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (上游已删除，保留本地版本)"
              elif [[ "$file" == .github/workflows/* ]]; then
                git checkout --ours "$file"
                git add "$file"
                FILE_DIFF=$(git diff "$VERSION" HEAD -- "$file" 2>/dev/null | head -100)
                if [ -n "$FILE_DIFF" ]; then
                  WORKFLOW_DIFFS="$WORKFLOW_DIFFS\n\n### $file\n\n\`\`\`diff\n$FILE_DIFF\n\`\`\`"
                fi
              else
                MANUAL="$MANUAL\n- ⚠️ \`$file\` (内容冲突，需人工解决)"
              fi
            done

            # 恢复所有本地 workflow 文件
            cp -f /tmp/workflow_backup/* .github/workflows/ 2>/dev/null || true
            git add .github/workflows/
            RESOLVED="$RESOLVED\n- ✅ 所有 workflow 文件 (保留本地版本)"

            git add -A
            git commit -m "Merge upstream release $VERSION (conflicts resolved)"
            git push origin "$BRANCH" --force

            # 保存变量供后续 step 使用（用文件存储多行内容）
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo -e "$RESOLVED" > /tmp/pr_resolved.txt
            echo -e "$MANUAL" > /tmp/pr_manual.txt
            echo -e "$WORKFLOW_DIFFS" > /tmp/pr_workflow_diffs.txt

            echo "merged=false" >> $GITHUB_OUTPUT
            echo "⚠️ Conflicts detected for v$VERSION"
          fi

      - name: Create PR for conflicts
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          GITHUB_TOKEN: ""
        run: |
          VERSION=${{ steps.merge.outputs.version }}
          BRANCH=${{ steps.merge.outputs.branch }}
          RESOLVED=$(cat /tmp/pr_resolved.txt)
          MANUAL=$(cat /tmp/pr_manual.txt)
          WORKFLOW_DIFFS=$(cat /tmp/pr_workflow_diffs.txt)

          # 动态生成 PR 描述
          PR_BODY="自动合并上游版本 $VERSION 时出现冲突。\n\n## 已自动解决\n$RESOLVED\n\n## 需人工处理\n$MANUAL"

          if [ -n "$WORKFLOW_DIFFS" ]; then
            PR_BODY="$PR_BODY\n\n---\n\n## 上游 workflow 文件变更（已丢弃，仅供参考）\n\n以下为上游对 workflow 文件的改动，本地版本已保留。如需采用上游改动，请手动合并。$WORKFLOW_DIFFS"
          fi

          PR_BODY="$PR_BODY\n\n---\n\n### 合并方式\n\n**请在合并 commit 消息中包含 \`[build]\` 以自动触发编译。**\n\n推荐使用以下 commit 消息：\n\`\`\`\nMerge upstream release $VERSION [build]\n\`\`\`\n\n或在 GitHub 合并页面底部的输入框中修改消息。"

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          gh pr create \
            --title "Merge upstream release $VERSION ($TIMESTAMP)" \
            --body "$(echo -e "$PR_BODY")" \
            --base custom-build \
            --head "$BRANCH" || echo "PR may already exist"

      - name: Trigger build
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'custom-build'
            });
            console.log('✅ Triggered build.yml');

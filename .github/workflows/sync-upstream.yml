name: Sync Upstream Release
# sync upstream release workflow
on:
  schedule:
    - cron: '23 3 * * *'  # 每天 UTC 03:23
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      workflows: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git 2>/dev/null || true
          git fetch upstream --tags --force

      - name: Check if merge needed
        id: check
        run: |
          # 获取上游最新版本 tag
          LATEST=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No upstream version tag found"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "📦 Upstream latest: $LATEST"

          # 检查上游最新 tag 的提交是否已在当前分支
          # 无论本地有没有 tag，只要代码已经包含上游提交就不用合并
          UPSTREAM_SHA=$(git rev-list -1 "$LATEST" 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "❌ Cannot resolve upstream tag $LATEST"
            exit 1
          fi

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "need_merge=false" >> $GITHUB_OUTPUT
            echo "✅ $LATEST commit already in history, skip merge"
          else
            echo "need_merge=true" >> $GITHUB_OUTPUT
            echo "📦 $LATEST commit not in history, need merge"
          fi

      - name: Merge upstream release
        if: steps.check.outputs.need_merge == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git fetch upstream tag "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 在 custom-build 上尝试合并
          if git merge "$VERSION" --no-edit -m "Merge upstream release $VERSION"; then
            # 无冲突：直接 push 到 custom-build
            git push origin HEAD
            echo "✅ Merged $VERSION"
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            # 有冲突：创建分支处理
            BRANCH="upstream-merge-$VERSION"
            git checkout -b "$BRANCH"

            CONFLICTS=$(git diff --name-only --diff-filter=U)
            RESOLVED=""
            MANUAL=""

            for file in $CONFLICTS; do
              if git status --porcelain "$file" | grep -q "^DU"; then
                # DU: HEAD 删除，上游修改 → 保持删除
                git rm "$file"
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (本地已删除，保持删除)"
              elif git status --porcelain "$file" | grep -q "^UD"; then
                # UD: HEAD 修改，上游删除 → 保留本地版本
                git checkout --ours "$file"
                git add "$file"
                RESOLVED="$RESOLVED\n- ✅ \`$file\` (上游已删除，保留本地版本)"
              else
                # UU: 双方修改 → 保留冲突标记
                MANUAL="$MANUAL\n- ⚠️ \`$file\` (内容冲突，需人工解决)"
              fi
            done

            git add -A
            git commit -m "Merge upstream release $VERSION (conflicts resolved)"
            git push origin "$BRANCH" --force

            # 动态生成 PR 描述
            PR_BODY="自动合并上游版本 $VERSION 时出现冲突。\n\n## 已自动解决\n$RESOLVED\n\n## 需人工处理\n$MANUAL"
            gh pr create \
              --title "Merge upstream release $VERSION" \
              --body "$(echo -e "$PR_BODY")" \
              --base custom-build \
              --head "$BRANCH" || echo "PR may already exist"
            echo "⚠️ Conflicts detected, PR created for v$VERSION"
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger build
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'custom-build'
            });
            console.log('✅ Triggered build.yml');

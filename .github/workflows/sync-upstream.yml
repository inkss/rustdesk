name: Sync Upstream Release

on:
  schedule:
    - cron: '23 3 * * *'  # 每天 UTC 03:23
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch upstream --tags

      - name: Check if merge needed
        id: check
        run: |
          # 获取上游最新版本 tag
          LATEST=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No upstream version tag found"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "📦 Upstream latest: $LATEST"

          # 检查上游最新 tag 的提交是否已在当前分支
          # 无论本地有没有 tag，只要代码已经包含上游提交就不用合并
          UPSTREAM_SHA=$(git rev-list -1 "$LATEST" 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "❌ Cannot resolve upstream tag $LATEST"
            exit 1
          fi

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "need_merge=false" >> $GITHUB_OUTPUT
            echo "✅ $LATEST commit already in history, skip merge"
          else
            echo "need_merge=true" >> $GITHUB_OUTPUT
            echo "📦 $LATEST commit not in history, need merge"
          fi

      - name: Merge upstream release
        if: steps.check.outputs.need_merge == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git fetch upstream tag "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 尝试合并
          if git merge "$VERSION" --no-edit -m "Merge upstream release $VERSION"; then
            git push origin HEAD
            echo "✅ Merged $VERSION"
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            # 合并冲突，创建 PR 让用户手动解决
            git merge --abort || true
            BRANCH="upstream-merge-$VERSION"
            git checkout -b "$BRANCH"
            git merge "$VERSION" --no-edit || true
            git push origin "$BRANCH" || git push origin "$BRANCH" --force
            gh pr create \
              --title "Merge upstream release $VERSION" \
              --body "自动合并上游版本 $VERSION 时出现冲突，请手动解决后合并。" \
              --base custom-build || true
            echo "⚠️ Conflicts detected, PR created for v$VERSION"
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger build
        if: steps.check.outputs.need_merge == 'false' || steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'custom-build'
            });
            console.log('✅ Triggered build.yml');

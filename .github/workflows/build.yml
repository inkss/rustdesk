name: Build RustDesk

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - custom-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.should_build.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build requested
        id: should_build
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/custom-build" ]; then
            # push 到 custom-build：检查 commit 消息是否包含 [build]
            MSG=$(git log -1 --pretty=%B)
            if echo "$MSG" | grep -q '\[build\]'; then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "✅ Build requested via [build] tag"
            else
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "⏭️ No [build] tag in commit message, skipping"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Add upstream remote
        if: github.event_name == 'workflow_dispatch'
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git 2>/dev/null || true
          git fetch upstream --tags --force

      - name: Resolve version
        if: steps.should_build.outputs.skip != 'true'
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # tag push：直接用 tag 名，去掉 v 前缀
            RAW="${{ github.ref_name }}"
          else
            # workflow_dispatch 或 push 到 custom-build：从上游获取最新版本
            RAW=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi

          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Cannot resolve version (raw: $RAW)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Resolved version: $VERSION"

      - name: Clean existing release
        if: steps.should_build.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          echo "🧹 Cleaning existing release/tag for $VERSION..."

          gh release delete "$VERSION" --yes 2>/dev/null || true
          git tag -d "$VERSION" 2>/dev/null || true
          git push origin ":refs/tags/$VERSION" 2>/dev/null || true

          echo "✅ Cleanup done"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      publish-release: true
      upload-tag: ${{ needs.prepare.outputs.version }}
